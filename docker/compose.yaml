services:
  postgres:
    image: postgres:16-alpine
    container_name: bativo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bativo}
      POSTGRES_USER: ${POSTGRES_USER:-bativo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bativo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bativo} -d ${POSTGRES_DB:-bativo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: bativo-php
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-bativo}:${POSTGRES_PASSWORD:-bativo}@postgres:5432/${POSTGRES_DB:-bativo}?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
    volumes:
      - ..:/var/www:cached
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: bativo-web
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ..:/var/www:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
