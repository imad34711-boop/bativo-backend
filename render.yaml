services:
  - type: web
    name: bativo-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bativo-db
          property: connectionString
      - key: CORS_ALLOW_ORIGIN
        value: https://your-frontend-domain.example.com
      - key: JWT_SECRET_KEY
        value: /var/www/html/config/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: /var/www/html/config/jwt/public.pem
      - key: JWT_PASSPHRASE
        value: replace-me
    initialDeployHook: php bin/console doctrine:migrations:migrate --no-interaction

databases:
  - name: bativo-db
    databaseName: bativo
    user: bativo
    plan: free
