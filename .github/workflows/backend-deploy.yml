name: backend-deploy

on:
  push:
    tags:
      - 'backend-v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t bativo-backend:${GITHUB_REF_NAME} .

      - name: Push image
        run: echo "Push to your registry here: docker push registry.example.com/bativo-backend:${GITHUB_REF_NAME}"
